name: 全国1234駅の公式リンク候補・分散巡回

on:
  # 03:00 JST (18:00 UTC on the preceding day). Bounded national daily
  # budget: 96 directory details + 120 candidate sites + 60 event-site probes.
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-events-update
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-road-events.txt
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements-road-events.txt
      - name: Refresh station scan cursor to latest main
        run: git pull --rebase origin main
      - name: Test safe national directory extraction offline
        run: PYTHONPATH=scripts python -m unittest scripts/test_station_official_directory_discovery.py scripts/test_station_coverage_registry.py scripts/test_station_website_review_queue.py scripts/test_station_website_priority.py scripts/test_station_website_batch_review.py scripts/test_station_source_triage.py scripts/test_station_national_event_probe.py scripts/test_station_bootstrap_dashboard.py
      - name: Respect robots policy and inspect at most 96 station details
        run: PYTHONPATH=scripts python scripts/station_official_directory_discovery.py
      - name: Refresh all 1234 station coverage records in the SAME job
        run: python scripts/station_coverage_registry.py
      - name: Prepare unverified station website review backlog
        run: python scripts/station_website_review_queue.py
      - name: Prioritize nationwide station website review
        run: python scripts/station_website_priority.py
      - name: Review up to 120 station websites before secondary partner links
        run: python scripts/station_website_batch_review.py
      - name: Prepare up to 50 nonpublishing station source proposals
        run: python scripts/station_source_triage.py
      - name: Probe up to 60 website candidates for strictly verified station events
        run: PYTHONPATH=scripts python scripts/station_national_event_probe.py
      - name: Build auditable 10-12 day national bootstrap dashboard
        run: PYTHONPATH=scripts python scripts/station_bootstrap_dashboard.py
      - name: Save URL hints and all-station dashboard together
        run: |
          git add docs/STATION_12_DAY_BOOTSTRAP_STATUS.md data/station_national_event_candidates.json data/station_national_event_probe_audit.json data/station_source_triage.json docs/STATION_SOURCE_TRIAGE_DASHBOARD.md data/station_website_batch_audit.json data/station_website_priority.json data/station_official_directory_candidates.json data/station_coverage_registry.json docs/STATION_COVERAGE_DASHBOARD.md data/station_website_review_queue.json
          if git diff --cached --quiet; then
            echo "公式名簿由来のURL候補は変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: record unverified national directory station link candidates"
          git pull --rebase origin main
          git push
