name: Rebuild PWA icons
on:
  push:
    paths:
      - '.iconbuild/READY'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild icons from chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .iconbuild/icon192.part* | tr -d '\n\r ' | base64 -d > icons/icon-192.png
          cat .iconbuild/icon512.part* | tr -d '\n\r ' | base64 -d > icons/icon-512.png
          test "$(python3 - <<'PY'
from PIL import Image
for p,n in [('icons/icon-192.png',192),('icons/icon-512.png',512)]:
    im=Image.open(p)
    assert im.size==(n,n), (p,im.size)
print('ok')
PY
          )" = "ok"
      - name: Commit rebuilt icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild adjusted PWA icons"
          git push
