name: 道の駅イベント情報（全国・地域別）
on:
  schedule:
    # Run after the 03:00 JST national source scan (up to 85 minutes).
    - cron: "0 6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-events-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-road-events.txt
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements-road-events.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Test event date extraction
        run: PYTHONPATH=scripts python -m unittest scripts/test_regional_association_events.py scripts/test_prefecture_event_coverage.py scripts/test_kanto_three_prefectures.py scripts/test_kanto_remaining_prefectures.py scripts/test_kinki_five_prefectures.py scripts/test_verified_station_engine.py scripts/test_station_discovery_engine.py scripts/test_fukutomi_event_discovery.py scripts/test_nonta_two_day_events.py scripts/test_station_batch_onboarding.py scripts/test_road_event_gap_monitor.py scripts/test_road_event_recall_audit.py scripts/test_national_event_source_priority.py scripts/test_nationwide_source_audit.py scripts/test_kanto_station_master.py scripts/test_national_collection_acceptance.py scripts/test_zero_prefecture_action_report.py scripts/test_national_published_event_quality.py scripts/test_station_national_event_probe.py
      - name: Audit nine official regional sources
        run: python scripts/nationwide_source_audit.py
      - name: Retrieve official event listings
        run: python scripts/collect_road_events.py
      - name: Watch verified station listings (no event publishing)
        run: python scripts/station_lightwatch.py --fetch --daily-verified --max-requests 40
      - name: Audit 47-prefecture coverage
        run: python scripts/prefecture_event_coverage.py
      - name: Build nationwide-first regional source priority dashboard
        run: python scripts/national_event_source_priority.py
      - name: Validate nationwide collection structure and missing audit evidence
        run: python scripts/national_collection_acceptance.py
      - name: Validate nationwide published event quality
        run: PYTHONPATH=scripts python scripts/national_published_event_quality.py
      - name: Monitor collection gaps and source health
        run: python scripts/road_event_gap_monitor.py
      - name: Build eleven-prefecture official-source action report
        run: python scripts/zero_prefecture_action_report.py
      - name: Independently cross-check official event notices
        run: python scripts/road_event_recall_audit.py
      - name: Update the all-station coverage and missing-official-URL queue
        run: python scripts/station_coverage_registry.py
      - name: Flag collection failure for GitHub notifications
        if: failure()
        run: |
          echo "::error title=道の駅イベント更新失敗::収集または品質検査が失敗しました。GitHub Actions のログを確認してください。"
      - name: Show update status in GitHub Actions summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## 道の駅イベント日次更新"
            echo ""
            echo "実行結果: **${JOB_STATUS}**"
            echo ""
            if [ "${JOB_STATUS}" != "success" ]; then
              echo "収集または品質検査に失敗しました。未検証の更新内容はGitHubへコミットしません。"
              echo "保存済みのイベント情報も最新である保証はないため、ログで原因を確認してください。"
            else
              echo "全国収集と検査が正常終了しました（掲載数・公式告知の網羅性は別途確認）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit only if event data changed
        run: |
          git add data/station_national_event_candidates.json data/station_national_event_probe_audit.json data/station_lightwatch_report.json data/station_lightwatch_state.json data/national_published_event_quality.json data/zero_prefecture_action_report.json data/national_collection_acceptance.json data/national_event_source_priority.json docs/NATIONAL_EVENT_PRIORITY_DASHBOARD.md data/road_events.json data/tohoku_event_adapter_audit.json data/chugoku_event_adapter_audit.json data/shikoku_event_adapter_audit.json data/hokkaido_event_audit.json data/kanto_association_event_audit.json data/road_event_sources_report.json data/chubu_event_layout_report.json data/road_event_quality_report.json data/hokuriku_event_audit.json data/kyushu_okinawa_event_audit.json data/kyushu_six_prefectures_audit.json data/prefecture_event_coverage.json data/kanto_three_prefectures_audit.json data/kanto_remaining_prefectures_audit.json data/kinki_five_prefectures_audit.json data/verified_station_reconfirmation_audit.json data/station_event_discovery_audit.json data/road_event_gap_monitor.json docs/ROAD_EVENT_GAP_DASHBOARD.md data/road_event_recall_audit.json docs/ROAD_EVENT_RECALL_DASHBOARD.md data/station_coverage_registry.json docs/STATION_COVERAGE_DASHBOARD.md
          if git diff --cached --quiet; then
            echo "イベントデータに変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh official roadside station events"
          git push
