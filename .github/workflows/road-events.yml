name: 道の駅イベント情報（全国・中四国）
on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-events-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-road-events.txt
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements-road-events.txt
      - name: Retrieve official event listings
        run: python scripts/collect_road_events.py
      - name: Commit only if event data changed
        run: |
          if git diff --quiet -- data/road_events.json; then
            echo "イベントデータに変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/road_events.json
          git commit -m "data: refresh official roadside station events"
          git push
