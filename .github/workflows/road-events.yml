name: 道の駅イベント情報（全国・地域別）
on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: road-events-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-road-events.txt
      - name: Install parser dependencies
        run: python -m pip install -r scripts/requirements-road-events.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Test event date extraction
        run: PYTHONPATH=scripts python -m unittest scripts/test_regional_association_events.py scripts/test_prefecture_event_coverage.py
      - name: Audit nine official regional sources
        run: python scripts/nationwide_source_audit.py
      - name: Retrieve official event listings
        run: python scripts/collect_road_events.py
      - name: Audit 47-prefecture coverage
        run: python scripts/prefecture_event_coverage.py
      - name: Commit only if event data changed
        run: |
          git add data/road_events.json data/road_event_sources_report.json data/chubu_event_layout_report.json data/road_event_quality_report.json data/hokuriku_event_audit.json data/kyushu_okinawa_event_audit.json data/kyushu_six_prefectures_audit.json data/prefecture_event_coverage.json
          if git diff --cached --quiet; then
            echo "イベントデータに変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh official roadside station events"
          git push
