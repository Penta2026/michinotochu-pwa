name: ツーリングイベント距離検索テスト

on:
  push:
    branches: [main]
    paths:
      - "tour-plan.js"
      - "app.js"
      - "index.html"
      - "service-worker.js"
      - "pwa.js"
      - "data/version.json"
      - "scripts/test_tour_event_distance.cjs"
      - ".github/workflows/tour-event-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tour-event-distance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: node --check tour-plan.js && node --check app.js && node --check pwa.js
      - name: Tour event distance UI regression
        run: node --test scripts/test_tour_event_distance.cjs
